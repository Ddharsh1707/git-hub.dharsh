<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#222831; color:#eee; font-family:Arial, sans-serif; }
  .board { display:grid; grid-template-columns:repeat(3, 90px); gap:8px; }
  .cell { width:90px; height:90px; background:#393e46; font-size:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:8px; }
  .cell.X { color:#00adb5; } .cell.O { color:#ff5722; }
  #status { font-size:22px; margin:20px; }
  button { padding:10px 20px; font-size:16px; border:none; border-radius:6px; background:#00adb5; color:#fff; cursor:pointer; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="board" id="board"></div>
  <div id="status">Player X's turn</div>
  <button id="restart">Restart</button>
<script>
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let cells, current, over;
  const boardEl = document.getElementById('board');
  const status = document.getElementById('status');

  function start() {
    cells = Array(9).fill('');
    current = 'X'; over = false;
    status.textContent = "Player X's turn";
    boardEl.innerHTML = '';
    cells.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.onclick = () => play(i, d);
      boardEl.append(d);
    });
  }

  function play(i, el) {
    if (over || cells[i]) return;
    cells[i] = current;
    el.textContent = current;
    el.classList.add(current);
    if (wins.some(w => w.every(k => cells[k] === current))) {
      status.textContent = `🎉 Player ${current} wins!`; over = true;
    } else if (cells.every(c => c)) {
      status.textContent = "It's a draw!"; over = true;
    } else {
      current = current === 'X' ? 'O' : 'X';
      status.textContent = `Player ${current}'s turn`;
    }
  }

  document.getElementById('restart').onclick = start;
  start();
</script>
</body>
</html>
