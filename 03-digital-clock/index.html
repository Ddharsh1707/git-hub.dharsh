<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#0f0; font-family:'Courier New', monospace; }
  #time { font-size:clamp(48px, 14vw, 120px); text-shadow:0 0 20px #0f0; }
  #date { font-size:24px; margin-top:10px; color:#8f8; }
  button { margin-top:30px; background:none; border:1px solid #0f0; color:#0f0; padding:8px 16px; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
  <div id="time">00:00:00</div>
  <div id="date"></div>
  <button id="toggle">Switch to 12-hour</button>
<script>
  let is24 = true;
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const now = new Date();
    let h = now.getHours();
    let suffix = '';
    if (!is24) { suffix = h >= 12 ? ' PM' : ' AM'; h = h % 12 || 12; }
    document.getElementById('time').textContent = `${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}${suffix}`;
    document.getElementById('date').textContent = now.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }

  document.getElementById('toggle').onclick = e => {
    is24 = !is24;
    e.target.textContent = is24 ? 'Switch to 12-hour' : 'Switch to 24-hour';
    tick();
  };

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
