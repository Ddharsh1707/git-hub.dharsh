<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  body { margin:0; min-height:100vh; background:linear-gradient(135deg,#667eea,#764ba2); font-family:Arial, sans-serif; display:flex; justify-content:center; padding-top:60px; box-sizing:border-box; }
  .box { background:#fff; width:360px; max-width:92vw; border-radius:12px; padding:20px; height:fit-content; }
  h1 { margin-top:0; color:#333; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px; }
  button { padding:10px 14px; border:none; border-radius:6px; background:#667eea; color:#fff; cursor:pointer; }
  ul { list-style:none; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #eee; }
  li span { flex:1; cursor:pointer; }
  li.done span { text-decoration:line-through; color:#aaa; }
  li button { background:#ee5253; padding:4px 10px; }
  .count { color:#777; font-size:14px; }
</style>
</head>
<body>
<div class="box">
  <h1>📝 To-Do List</h1>
  <form id="form">
    <input id="task" placeholder="Add a new task..." autocomplete="off">
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <p class="count" id="count"></p>
</div>
<script>
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch {}

  const list = document.getElementById('list');
  const input = document.getElementById('task');

  function save() { try { localStorage.setItem('todos', JSON.stringify(todos)); } catch {} }

  function render() {
    list.innerHTML = '';
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const span = document.createElement('span');
      span.textContent = t.text;
      span.onclick = () => { t.done = !t.done; save(); render(); };
      const del = document.createElement('button');
      del.textContent = '✕';
      del.onclick = () => { todos.splice(i, 1); save(); render(); };
      li.append(span, del);
      list.append(li);
    });
    const left = todos.filter(t => !t.done).length;
    document.getElementById('count').textContent = `${left} task(s) left`;
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    input.value = '';
    save(); render();
  });

  render();
</script>
</body>
</html>
