<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Slider</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#111; font-family:Arial, sans-serif; }
  .slider { position:relative; width:600px; max-width:92vw; height:350px; overflow:hidden; border-radius:12px; }
  .track { display:flex; height:100%; transition:transform .5s ease; }
  .slide { min-width:100%; display:flex; align-items:center; justify-content:center; font-size:40px; color:#fff; font-weight:bold; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.4); color:#fff; border:none; font-size:28px; width:44px; height:44px; border-radius:50%; cursor:pointer; }
  #prev { left:10px; } #next { right:10px; }
  .dots { position:absolute; bottom:12px; width:100%; display:flex; justify-content:center; gap:8px; }
  .dot { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.5); cursor:pointer; }
  .dot.active { background:#fff; }
</style>
</head>
<body>
<div class="slider">
  <div class="track" id="track">
    <div class="slide" style="background:linear-gradient(135deg,#f093fb,#f5576c)">🌅 Sunset</div>
    <div class="slide" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">🌊 Ocean</div>
    <div class="slide" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">🌲 Forest</div>
    <div class="slide" style="background:linear-gradient(135deg,#fa709a,#fee140)">🌸 Spring</div>
    <div class="slide" style="background:linear-gradient(135deg,#30cfd0,#330867)">🌌 Night Sky</div>
  </div>
  <button class="nav" id="prev">‹</button>
  <button class="nav" id="next">›</button>
  <div class="dots" id="dots"></div>
</div>
<script>
  const track = document.getElementById('track');
  const total = track.children.length;
  const dots = document.getElementById('dots');
  let index = 0;

  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.onclick = () => go(i);
    dots.append(d);
  }

  function go(i) {
    index = (i + total) % total;
    track.style.transform = `translateX(-${index * 100}%)`;
    [...dots.children].forEach((d, k) => d.classList.toggle('active', k === index));
  }

  document.getElementById('prev').onclick = () => go(index - 1);
  document.getElementById('next').onclick = () => go(index + 1);
  setInterval(() => go(index + 1), 4000);
  go(0);
</script>
</body>
</html>
