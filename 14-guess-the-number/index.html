<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#222; color:#eee; font-family:Arial, sans-serif; text-align:center; }
  .card { background:#333; padding:30px; border-radius:12px; width:320px; max-width:92vw; }
  input { width:100px; padding:10px; font-size:22px; text-align:center; border:none; border-radius:6px; }
  button { padding:10px 18px; font-size:18px; border:none; border-radius:6px; background:#f1c40f; cursor:pointer; margin:10px 5px; }
  #msg { font-size:20px; min-height:28px; margin:10px; }
  #history { color:#aaa; }
</style>
</head>
<body>
<div class="card">
  <h1>🔢 Guess the Number</h1>
  <p>I'm thinking of a number between 1 and 100.</p>
  <input type="number" id="guess" min="1" max="100">
  <div>
    <button id="check">Guess</button>
    <button id="restart">New game</button>
  </div>
  <div id="msg"></div>
  <div id="history"></div>
</div>
<script>
  let secret, tries, guesses;
  const msg = document.getElementById('msg');
  const input = document.getElementById('guess');

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;
    tries = 0; guesses = [];
    msg.textContent = '';
    document.getElementById('history').textContent = '';
    input.value = ''; input.disabled = false;
  }

  function check() {
    const g = parseInt(input.value);
    if (!g || g < 1 || g > 100) { msg.textContent = 'Enter a number from 1 to 100'; return; }
    tries++; guesses.push(g);
    if (g === secret) { msg.textContent = `🎉 Correct! You got it in ${tries} tries.`; input.disabled = true; }
    else msg.textContent = g < secret ? '📈 Too low!' : '📉 Too high!';
    document.getElementById('history').textContent = 'Your guesses: ' + guesses.join(', ');
    input.value = ''; input.focus();
  }

  document.getElementById('check').onclick = check;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  document.getElementById('restart').onclick = newGame;
  newGame();
</script>
</body>
</html>
