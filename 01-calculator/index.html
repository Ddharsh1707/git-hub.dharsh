<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#1e1e2f; font-family:Arial, sans-serif; }
  .calc { background:#2b2b40; padding:20px; border-radius:16px; width:280px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  #display { width:100%; height:60px; font-size:28px; text-align:right; border:none; border-radius:8px; padding:0 10px; box-sizing:border-box; margin-bottom:15px; background:#11111b; color:#fff; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button { height:55px; font-size:20px; border:none; border-radius:8px; cursor:pointer; background:#3d3d5c; color:#fff; }
  button:hover { filter:brightness(1.2); }
  .op { background:#ff9f43; }
  .eq { background:#10ac84; grid-column:span 2; }
  .clr { background:#ee5253; }
</style>
</head>
<body>
<div class="calc">
  <input id="display" readonly value="0">
  <div class="keys">
    <button class="clr" data-v="C">C</button>
    <button data-v="DEL">⌫</button>
    <button class="op" data-v="%">%</button>
    <button class="op" data-v="/">÷</button>
    <button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
    <button class="op" data-v="*">×</button>
    <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
    <button class="op" data-v="-">−</button>
    <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
    <button class="op" data-v="+">+</button>
    <button data-v="0">0</button><button data-v=".">.</button>
    <button class="eq" data-v="=">=</button>
  </div>
</div>
<script>
  const display = document.getElementById('display');
  let expr = '';

  function press(v) {
    if (v === 'C') expr = '';
    else if (v === 'DEL') expr = expr.slice(0, -1);
    else if (v === '=') {
      try {
        // Only digits and operators reach here, so this is safe to evaluate
        const result = Function('return (' + expr + ')')();
        expr = Number.isFinite(result) ? String(+result.toFixed(10)) : '';
        if (!expr) { display.value = 'Error'; return; }
      } catch { display.value = 'Error'; expr = ''; return; }
    } else expr += v;
    display.value = expr || '0';
  }

  document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => press(b.dataset.v)));
  document.addEventListener('keydown', e => {
    if (/^[0-9+\-*/.%]$/.test(e.key)) press(e.key);
    else if (e.key === 'Enter' || e.key === '=') press('=');
    else if (e.key === 'Backspace') press('DEL');
    else if (e.key === 'Escape') press('C');
  });
</script>
</body>
</html>
