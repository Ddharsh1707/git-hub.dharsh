<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1a1a2e; color:#fff; font-family:Arial, sans-serif; text-align:center; }
  .choices { display:flex; gap:15px; margin:20px; }
  .choices button { font-size:50px; width:100px; height:100px; border-radius:50%; border:4px solid #e94560; background:#16213e; cursor:pointer; }
  .choices button:hover { transform:scale(1.1); }
  #score { font-size:22px; }
  #result { font-size:26px; margin:15px; min-height:32px; }
  #moves { font-size:20px; color:#aaa; }
</style>
</head>
<body>
  <h1>Rock ✊ Paper ✋ Scissors ✌️</h1>
  <div id="score">You 0 : 0 Computer</div>
  <div class="choices">
    <button data-c="rock">✊</button>
    <button data-c="paper">✋</button>
    <button data-c="scissors">✌️</button>
  </div>
  <div id="moves">Pick one to play</div>
  <div id="result"></div>
<script>
  const emoji = { rock: '✊', paper: '✋', scissors: '✌️' };
  const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
  let you = 0, cpu = 0;

  document.querySelectorAll('.choices button').forEach(b => b.onclick = () => {
    const mine = b.dataset.c;
    const theirs = Object.keys(emoji)[Math.floor(Math.random() * 3)];
    let msg;
    if (mine === theirs) msg = "It's a tie!";
    else if (beats[mine] === theirs) { msg = 'You win! 🎉'; you++; }
    else { msg = 'You lose 😢'; cpu++; }
    document.getElementById('moves').textContent = `You ${emoji[mine]}  vs  ${emoji[theirs]} Computer`;
    document.getElementById('result').textContent = msg;
    document.getElementById('score').textContent = `You ${you} : ${cpu} Computer`;
  });
</script>
</body>
</html>
